LoadModule tile_module /usr/lib/apache2/modules/mod_tile.so

# =============================================================================
# mod_tile Konfiguration
# =============================================================================

# Statistiken aktivieren (erreichbar über /mod_tile Status-URL)
ModTileEnableStats On

# Bulk-Modus deaktiviert (nur für Massen-Rendering aktivieren)
ModTileBulkMode Off

# -----------------------------------------------------------------------------
# Anfrage-Timeouts
# -----------------------------------------------------------------------------

# Wartezeit in Sekunden für veraltete Kacheln (danach wird alte Version geliefert)
ModTileRequestTimeout 3

# Wartezeit in Sekunden für fehlende Kacheln (danach wird Fehler zurückgegeben)
ModTileMissingRequestTimeout 10

# -----------------------------------------------------------------------------
# Last-Grenzen für Rendering
# -----------------------------------------------------------------------------

# Max. Systemlast, ab der veraltete Kacheln NICHT mehr neu gerendert werden
# Empfehlung: 16 – aktuell sehr konservativ eingestellt
ModTileMaxLoadOld 10

# Max. Systemlast, ab der fehlende Kacheln NICHT mehr gerendert werden
# Empfehlung: 50 – aktuell sehr konservativ eingestellt
ModTileMaxLoadMissing 15

# -----------------------------------------------------------------------------
# Cache-Einstellungen
# -----------------------------------------------------------------------------

# Erweiterter Cache (auskommentiert – optional für lange Cache-Zeiten)
#ModTileCacheExtendedDuration 2592000

# Maximale Cache-Dauer: 7 Tage (604800 Sekunden)
ModTileCacheDurationMax 604800

# Cache-Dauer für veraltete Kacheln: 15 Minuten (900 Sekunden)
ModTileCacheDurationDirty 900

# Minimale Cache-Dauer: 3 Stunden (10800 Sekunden)
ModTileCacheDurationMinimum 10800

# Cache-Dauer für mittlere Zoomstufen: Zoom 13 = 1 Tag (86400 Sekunden)
ModTileCacheDurationMediumZoom 13 86400

# Cache-Dauer für niedrige Zoomstufen: Zoom 9 = 6 Tage (518400 Sekunden)
ModTileCacheDurationLowZoom 9 518400

# Cache-Alter-Faktor: 20% der Zeit seit letzter Änderung als Cache-Dauer
ModTileCacheLastModifiedFactor 0.20

# -----------------------------------------------------------------------------
# Throttling (Anfragen-Begrenzung)
# -----------------------------------------------------------------------------

# Throttling deaktiviert (empfohlen für privaten/internen Server)
ModTileEnableTileThrottling Off

# X-Forwarded-For Header nicht für Throttling verwenden
ModTileEnableTileThrottlingXForward 0

# Throttling-Parameter (Kacheln: Pool 10000, Rate 1/s | Renders: Pool 128, Rate 0.2/s)
# Nur aktiv wenn ModTileEnableTileThrottling On
ModTileThrottlingTiles 10000 1
ModTileThrottlingRenders 128 0.2

# -----------------------------------------------------------------------------
# Status- und Debug-URLs (auskommentiert = deaktiviert)
# -----------------------------------------------------------------------------
#ModTileEnableStatusURL Off
#ModTileEnableDirtyURL Off