<!DOCTYPE html>
<html>
    <head>
        <title>Custom Tile Server</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

        <style>
            html, body, #map {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            #map {
                border: 2px solid #ccc;
                z-index: 0;
            }

            #controls {
                position: absolute;
                top: 100px;
                left: 10px;
                background: white;
                padding: 10px;
                border-radius: 5px;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
                z-index: 1000; /* Ensures controls are above the map */
            }
        </style>
    </head>

    <body>
        <div id="map"></div>
        <div id="controls">
            <label>
                <input type="checkbox" id="seamarkToggle" checked /> Show Seamarks
            </label>
            <br />
            <label>
                <input type="checkbox" id="depthContoursToggle" /> Show Depth Contours
            </label>
        </div>

        <script>
            var map = L.map('map').setView([54.1775, 12.0846], 10); // Centered on Warnemünde, Germany

            // Base Tile Layer
            var baseLayer = L.tileLayer('https://t2.openseamap.org/tile/{z}/{x}/{y}.png', {
                maxZoom: 19,
                errorTileUrl: 'path-to-error-tile.png',
                attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors, <a href="https://creativecommons.org/licenses/by-sa/2.0/">CC-BY-SA</a>'
            });

            // Seamark Tile Layer
            var seamarkLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: 'Seamark data &copy; <a href="https://www.openseamap.org/">OpenSeaMap</a>'
            });

            // Depth Contours WMS Layer
            const depthContoursLayer = L.tileLayer.wms('https://fbinter.stadt-berlin.de/fb/wms/senstadt/gewmor2?', {
                layers: '1', // Layer name from the WMS Capabilities
                format: 'image/png', // Format specified in the WMS
                transparent: true, // Enable transparency
                version: '1.3.0', // WMS version
                attribution: '© Geoportal Berlin'
              });

            // Add base layer to the map
            baseLayer.addTo(map);
            seamarkLayer.addTo(map);

            // Example Marker
            var marker = L.marker([54.1775, 12.0846]).addTo(map);
            marker.bindPopup("Warnemünde, Germany").openPopup();

            // Geolocation (optional)
            map.locate({ setView: true, maxZoom: 16 });

            // Toggle Seamark Layer
            var seamarkToggle = document.getElementById('seamarkToggle');
            seamarkToggle.addEventListener('change', function () {
                if (this.checked) {
                    seamarkLayer.addTo(map);
                } else {
                    map.removeLayer(seamarkLayer);
                }
            });

            // Toggle Depth Contours Layer
            var depthContoursToggle = document.getElementById('depthContoursToggle');
            depthContoursToggle.addEventListener('change', function () {
                if (this.checked) {
                    depthContoursLayer.addTo(map);
                } else {
                    map.removeLayer(depthContoursLayer);
                }
            });
        </script>
    </body>
</html>
